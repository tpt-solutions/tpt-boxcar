[package]
name = "tpt-chisel-core"
description = "Core library for TPT Chisel: automated OCI image distiller and Wasm migrator with LLM-assisted analysis."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["wasm", "container", "llm", "distiller", "oci"]
categories = ["development-tools", "wasm"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
lru = "0.12"
rand = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "http1", "tokio"] }
hyper-rustls = { version = "0.27", features = ["webpki-roots"] }
http-body-util = "0.1"
http = "1"
rustls = "0.23"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
wasmparser = "0.221"
which = "6"

[dev-dependencies]
tempfile = "3"