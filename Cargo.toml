[workspace]
resolver = "2"
members = [
    "origin/core",
    "origin/cli",
    "tether/proxy",
    "scope/agent",
    "chisel/core",
    "chisel/cli",
    "frontier/proxy",
    "frontier/plugin-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tpt-boxcar/tpt-boxcar"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
