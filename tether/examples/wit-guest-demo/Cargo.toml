[workspace]

[package]
name = "tether-wit-guest-demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Standalone crate, deliberately NOT a tpt-boxcar workspace member: it pulls in
# wit-bindgen (guest-only codegen) and only ever targets wasm32-wasip1, neither
# of which any host crate in the workspace should depend on.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
