[package]
name = "tpt-scope-agent"
description = "Host-side observability agent for TPT Scope: collects metrics, traces, and eBPF events and forwards them via OTLP to the Scope ingest pipeline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["observability", "otlp", "tracing", "ebpf", "metrics"]
categories = ["development-tools", "network-programming"]

[dependencies]
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
opentelemetry = { version = "0.24", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.17", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-semantic-conventions = "0.16"
prost = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
scope-ebpf-loader = { path = "../ebpf/loader", version = "0.1", optional = true }

[features]
# Off by default: pulls in `scope-ebpf-loader` (and transitively `aya`),
# which only builds on Linux and needs its eBPF object compiled by a
# nightly toolchain via `aya-build` (see scope/ebpf/loader/build.rs). Plain
# `cargo build --workspace` never touches this path.
ebpf = ["dep:scope-ebpf-loader"]
