[package]
name = "tpt-origin-core"
description = "Embeddable runtime for TPT Origin: manifest parsing, OCI/Wasm/process lifecycle management, local DNS and networking for the unified local sandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_yaml.workspace = true
wasmtime = "25"
wasmtime-wasi = "25"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
sha2 = "0.10"
tpt-scope-agent = { path = "../../scope/agent" }

[target.'cfg(target_os = "linux")'.dependencies]
containerd-client = "0.6"
tonic = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["containerd"]
containerd = []

[dev-dependencies]
wat = "1"
tempfile = "3"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "coldstart_bench"
harness = false
