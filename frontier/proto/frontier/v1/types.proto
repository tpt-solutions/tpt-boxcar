syntax = "proto3";

package frontier.v1;

option go_package = "github.com/tpt-cloud-native/frontier/control-plane/internal/pb/frontier/v1;frontierv1";

// Route defines a routing rule from a path prefix to an upstream cluster.
message Route {
  string name = 1;
  string prefix = 2;
  string cluster = 3;
  map<string, string> headers = 4;
  uint32 priority = 5;
  bool strip_prefix = 6;
}

// Upstream defines a cluster of backend endpoints.
message Upstream {
  string name = 1;
  string type = 2;  // EDS, STATIC, DNS
  repeated string endpoints = 3;
  string connect_timeout = 4;
  string lb_policy = 5;  // ROUND_ROBIN, LEAST_CONN, CONSISTENT_HASH
}

// Plugin configures a request/response transformation plugin.
message Plugin {
  string name = 1;
  string type = 2;
  map<string, string> config = 3;
}

// TlsCert holds a TLS certificate for downstream or upstream mTLS.
message TlsCert {
  string name = 1;
  string cert_pem = 2;
  string key_pem = 3;
  string ca_pem = 4;
}

// ConfigSnapshot is the full config state at a given version.
message ConfigSnapshot {
  int64 version = 1;
  map<string, Route> routes = 2;
  map<string, Upstream> upstreams = 3;
  map<string, Plugin> plugins = 4;
  map<string, TlsCert> tls_certs = 5;
}

// ConfigDiff carries incremental changes between two versions.
message ConfigDiff {
  int64 base_version = 1;
  int64 target_version = 2;
  map<string, Route> added_or_updated_routes = 10;
  repeated string removed_routes = 11;
  map<string, Upstream> added_or_updated_upstreams = 12;
  repeated string removed_upstreams = 13;
  map<string, Plugin> added_or_updated_plugins = 14;
  repeated string removed_plugins = 15;
  map<string, TlsCert> added_or_updated_tls_certs = 16;
  repeated string removed_tls_certs = 17;
}
